[project]
name = "starkiller"
version = "0.1.0"
description = "Astronomical image calibration, stacking and processing from the command line"
requires-python = ">=3.13"
dependencies = [
    "astropy>=7.0",
    "numpy>=2.1",
    "pillow>=11.0",
    "rawpy>=0.24",
]

[project.scripts]
starkiller = "starkiller.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starkiller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "nas: needs the full M13 data set mounted at $STARKILLER_DATA (slow)",
    "slow: takes more than a few seconds",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "tools"]

[[tool.mypy.overrides]]
module = ["rawpy.*", "astropy.*"]
ignore_missing_imports = true
