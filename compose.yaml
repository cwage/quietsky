services:
  quietsky:
    build: .
    image: quietsky:dev
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    environment:
      QUIETSKY_DATA: /data
    volumes:
      - .:/app
      # Source frames and PixInsight reference output, never written to.
      - "${QUIETSKY_DATA_DIR:-./data}:/data:ro"
